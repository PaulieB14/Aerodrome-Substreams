[package]
name = "aerodrome-substreams"
version = "1.0.0"
edition = "2021"
description = "High-performance Substreams for Aerodrome Finance on Base with OHLCV candles, SQL sink support (PostgreSQL/ClickHouse), and delta updates"
license = "MIT"
repository = "https://github.com/PaulieB14/Aerodrome-Substreams"
keywords = ["base", "aerodrome", "dex", "substreams", "blockchain"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Substreams core
substreams = "0.8.0"
substreams-ethereum = "0.12.0"
ethabi = "17.2"

# Database sink support
substreams-database-change = "5.0.0"

# Protobuf serialization
buffa = "0.9.2"
buffa-types = "0.9.2"

# Utilities
hex = "0.4"
hex-literal = "0.4"
anyhow = "1.0"
num-bigint = "0.4"

# WASM compatibility
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
substreams-ethereum = "0.12.0"
anyhow = "1.0"

[profile.release]
lto = true
opt-level = 'z'
strip = true
